# Backend assessment §3 (LOW): no credentials committed to source. dev/prod
# each read from environment variables, with dev-only defaults so a fresh
# clone works out of the box against a local Postgres. %test intentionally
# configures no datasource at all: Quarkus Dev Services provisions a
# throwaway PostgreSQL Testcontainer automatically for `mvn test`, so CI
# never touches real credentials or a real database.

quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.username=${DB_USERNAME:workflow_user}
%dev.quarkus.datasource.password=${DB_PASSWORD:workflow123}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ura_workflow_engine}

%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.http.root-path=/api
